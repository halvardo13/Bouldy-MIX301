<svg viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustrated bouldering wall with a route marked in lime" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- back wall -->
  <rect x="40" y="140" width="190" height="380" rx="28" fill="#3F5F45"/>
  <circle cx="90" cy="220" r="12" fill="#8FB08F"/>
  <ellipse cx="150" cy="300" rx="20" ry="12" transform="rotate(-18 150 300)" fill="#E0F57A"/>
  <circle cx="100" cy="380" r="9" fill="#6F9477"/>
  <circle cx="165" cy="440" r="13" fill="#8FB08F"/>

  <!-- floor mat -->
  <rect x="50" y="508" width="500" height="54" rx="27" fill="#2A3F31"/>

  <!-- boulder -->
  <path d="M190 520 L150 250 Q142 190 200 168 L380 108 Q440 90 462 140 L500 440 Q508 500 450 520 Z" fill="#243B2F"/>
  <path d="M190 520 L150 250 Q142 190 200 168 L262 147 L304 520 Z" fill="#2F4A3A"/>

  <!-- holds -->
  <ellipse cx="330" cy="215" rx="40" ry="22" transform="rotate(-20 330 215)" fill="#E0F57A"/>
  <ellipse cx="402" cy="300" rx="30" ry="18" transform="rotate(15 402 300)" fill="#F9F9F7"/>
  <circle cx="270" cy="330" r="26" fill="#6F9477"/>
  <circle cx="360" cy="392" r="16" fill="#E0F57A"/>
  <path d="M276 446 q42 -34 86 0 q-42 16 -86 0z" fill="#8FB08F"/>
  <ellipse cx="412" cy="426" rx="34" ry="26" fill="#3F5F45" stroke="#6F9477" stroke-width="4"/>
  <circle cx="236" cy="252" r="10" fill="#8FB08F"/>
  <circle cx="436" cy="204" r="12" fill="#6F9477"/>
  <circle cx="226" cy="410" r="9" fill="#E0F57A"/>
  <circle cx="460" cy="340" r="8" fill="#8FB08F"/>

  <!-- route -->
  <path d="M300 446 Q338 426 360 392 Q392 352 402 300 Q380 250 330 215 Q336 180 372 150" fill="none" stroke="#E0F57A" stroke-width="5" stroke-linecap="round" stroke-dasharray="1 13"/>

  <!-- finish badge -->
  <circle cx="376" cy="178" r="15" fill="#3F5F45"/>
  <path d="M369 178 l5 5 l9 -10" fill="none" stroke="#F9F9F7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- sparkles -->
  <path d="M440 56 Q444 82 470 86 Q444 90 440 116 Q436 90 410 86 Q436 82 440 56Z" fill="#E0F57A"/>
  <path d="M150 120 Q152 134 166 136 Q152 138 150 152 Q148 138 134 136 Q148 134 150 120Z" fill="#E0F57A"/>

  <!-- chalk dust -->
  <circle cx="120" cy="500" r="7" fill="#CFDDBE"/>
  <circle cx="146" cy="486" r="4" fill="#CFDDBE"/>
  <circle cx="520" cy="488" r="6" fill="#CFDDBE"/>
</svg>
